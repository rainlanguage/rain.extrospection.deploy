# Release metadata, not foundry config: `rainix-tag-release` rewrites `version`
# from the tag it is triggered by. `[external.*]` is the section foundry
# reserves for another tool's config: it never merges it into a profile and
# never warns about it.
[external.package]
name = "rain-extrospection-deploy"
# Deploy repo: this is the version of the LAST Soldeer publish, not a
# next-version slot. A normal PR does not bump it; only a release moves it.
# Nothing is published yet, so the first release sets this to the version its
# `sol-v*` tag names.
version = "0.1.0"

[profile.default]
src = 'src'
test = 'test'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

# `Extrospect`'s deterministic deploy address, runtime codehash and creation
# bytecode are recorded in the generated `src/generated/candidate/Extrospect.sol`
# snapshot and are a pure function of the creation code, which is a function of
# these settings. They are pinned exactly rather than floated so the record
# cannot move under a compiler or default-target change, and they match the
# settings `rain.extrospection` compiles the same contract with.
solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false
libs = ["dependencies"]

# `script/Build.sol` writes the generated snapshot and libs under `src/`, and
# reads the release version from this file when `cutRelease()` runs.
# `ExtrospectDeploySnapshotTest`'s inherited frozen-record walk reads
# `src/generated/` too, so tests need the same read access.
fs_permissions = [
  { access = "read", path = "./foundry.toml" },
  { access = "read-write", path = "./src" },
]

[fuzz]
runs = 2048

# Behaviour-only view of the test suite, for mutation and coverage campaigns.
# `ExtrospectConstantsTest` ties the generated candidate snapshot to the
# deployed V1 record and to `type(Extrospect).creationCode`/`runtimeCode`, and
# `ExtrospectDeploySnapshotTest`'s inherited assertions anchor the same
# snapshot to source. Compiler outputs change for any edit to any source file
# reachable from `Extrospect`, so both contracts fail under every source
# mutation, observable or not, and a campaign that includes them scores every
# mutant as killed. This profile drops them and inherits everything else from
# `default`.
[profile.mutation]
no_match_contract = "ExtrospectConstantsTest|ExtrospectDeploySnapshotTest"

# `recursive_deps` is off, so every package an import resolves through is
# declared here, including `rain-solmem` — reached from `rain-extrospection`'s
# `LibExtrospectBytecode`.
[dependencies]
# Held at the version `rain-deploy` and `rain-sol-codegen` import by path
# (`forge-std-1.16.2/src/Test.sol` and friends): one version per package, so
# this cannot move until both of those do.
forge-std = "1.16.2"
"rain-extrospection" = "0.1.14"
"rain-solmem" = "0.1.28"
"rain-deploy" = "0.1.11"
# `LibMemoryKV` — reached from `rain-deploy`'s `RainDeployVerifySnapshotBase`,
# which `ExtrospectDeploySnapshotTest` inherits.
"rain-lib-memkv" = "0.2.0"
# `LibRainDeploySnapshot` — reached from `script/Build.sol` and the shipped
# verify abstracts — emits the generated record via `LibCodeGen`/`LibFs`.
"rain-sol-codegen" = "0.1.37"

[soldeer]
recursive_deps = false

# One alias per network `LibRainDeploy.supportedNetworks()` returns, which is
# what `script/Deploy.sol` broadcasts to.
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
flare = "${FLARE_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

# `rainix-manual-sol-artifacts` passes `--verify` by default and exports exactly
# these variable names, so a deploy without this section broadcasts and then
# fails with no API key configured for the chain. One entry per
# `[rpc_endpoints]` alias, because the deploy goes to all of them.
#
# Both sections are held to `LibRainDeploy.supportedNetworks()`, in both
# directions, by the inherited `testSupportedNetworksAreFullyConfigured`, which
# also requires at least one of "chain" or "url" on every entry: foundry raises
# a config error for an unknown alias with neither, and that error takes down
# verification for the whole section. "chain" is stated on every entry rather
# than only on the aliases foundry cannot resolve, because which aliases those
# are is foundry's own table. Each stated "chain" is compared against the chain
# id its `[rpc_endpoints]` alias reports by the inherited
# `testSupportedNetworkChainIdsAreBound`.
[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}", chain = 42161 }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}", chain = 84532 }
bsc = { key = "${CI_DEPLOY_BSC_ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}", chain = 14 }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}", chain = 137 }
# Robinhood Chain (4663) is not indexed by Etherscan V2; its Blockscout
# explorer speaks the Etherscan API, so the entry points there.
robinhood = { key = "${CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
